<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>שחר בעל הנס</title>
    <meta name="description" content="שחר בעל הנס — Honda Insight, שפריצרים, אנימציה בלבד." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='48'>💦</text></svg>">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="שחר בעל הנס">
      <h1 class="title">שחר בעל הנס</h1>

      <section class="scene" aria-label="Honda Insight עם אנימציית שפריצרים">
        <div class="car-wrap">
          <img
            class="car"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/2009_Honda_Insight_EX_CVT_1.3_Front.jpg/1280px-2009_Honda_Insight_EX_CVT_1.3_Front.jpg"
            alt="Honda Insight"
          />
          <div class="blue-tint" aria-hidden="true"></div>

          <div class="spray-base spray-left"></div>
          <div class="spray-base spray-right"></div>
          <div class="spray-base spray-center"></div>

          <div class="mist mist-left"></div>
          <div class="mist mist-right"></div>

          <div class="wiper wiper-left"></div>
          <div class="wiper wiper-right"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
